name: Python & Architecture Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Repository Integrity & Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install "pydantic>=2.10" "pytest>=8.3"

      - name: Run guardrail, tool and schema tests
        run: python3 -m pytest -q

      - name: Validate Source Tree & Architecture Documentation
        run: python3 -c "import pathlib; root = pathlib.Path('.'); files = [p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]; print(f'Verified {len(files)} repository files and README architecture cleanly.')"
